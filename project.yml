name: PhotoDiary
options:
  bundleIdPrefix: com.kejincai
  deploymentTarget:
    iOS: "27.0"
    watchOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEVELOPMENT_TEAM: B82CAW4M9Y
targets:
  PhotoDiary:
    type: application
    platform: iOS
    sources:
      - path: PhotoDiary
      - path: Shared
    dependencies:
      - target: PhotoDiaryWatch
    # 手记建议（JournalingSuggestions）需要付费开发者账号的 com.apple.developer.journal.allow 权限，个人团队签不了。
    # 加入 Apple Developer Program 后，取消下面的注释，并在 SWIFT_ACTIVE_COMPILATION_CONDITIONS 里加上 JOURNALING_SUGGESTIONS。
    # entitlements:
    #   path: PhotoDiary/PhotoDiary.entitlements
    #   properties:
    #     com.apple.developer.journal.allow: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kejincai.photodiary
        PRODUCT_NAME: PhotoDiary
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: PhotoDiary/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Photo Diary
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Photo Diary keeps your diary in each photo's caption. It needs to read and edit captions, and never copies or uploads your photos.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDevelopmentRegion: en
        INFOPLIST_KEY_PHPhotoLibraryPreventAutomaticLimitedAccessAlert: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_LANGUAGE: zh-Hans
        CODE_SIGN_STYLE: Automatic
  PhotoDiaryWatch:
    type: application
    platform: watchOS
    sources:
      - path: PhotoDiaryWatch
      - path: Shared
      - path: PhotoDiary/Resources/Localizable.xcstrings
      - path: PhotoDiary/Resources/InfoPlist.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kejincai.photodiary.watchkitapp
        PRODUCT_NAME: PhotoDiaryWatch
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Photo Diary
        INFOPLIST_KEY_CFBundleDevelopmentRegion: en
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.kejincai.photodiary
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_LANGUAGE: zh-Hans
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  PhotoDiaryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PhotoDiaryTests
    dependencies:
      - target: PhotoDiary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kejincai.photodiary.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PhotoDiary.app/PhotoDiary"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  PhotoDiaryWatch:
    build:
      targets:
        PhotoDiaryWatch: all
  PhotoDiary:
    build:
      targets:
        PhotoDiary: all
        PhotoDiaryTests: [test]
    test:
      targets:
        - PhotoDiaryTests
