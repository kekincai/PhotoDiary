name: PhotoDiary
options:
  bundleIdPrefix: com.kejincai
  deploymentTarget:
    iOS: "27.0"
    watchOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEVELOPMENT_TEAM: B82CAW4M9Y
targets:
  PhotoDiary:
    type: application
    platform: iOS
    sources:
      - path: PhotoDiary
      - path: Shared
      # App 和小组件扩展共用：photodiary:// 链接、写日记的 App Intent、小组件快照。
      - path: WidgetShared
    dependencies:
      # Mac（Catalyst）版不带 Watch App。
      - target: PhotoDiaryWatch
        platformFilter: iOS
      # 小组件和控制中心按钮。Mac 版不带。
      - target: PhotoDiaryWidgets
        platformFilter: iOS
    # App Group：App 把小组件要的快照和缩小的照片写进共享容器。个人团队签得了（2026.11 验证过真机构建）。
    # 手记建议（JournalingSuggestions）需要付费开发者账号的 com.apple.developer.journal.allow 权限，个人团队签不了。
    # 加入 Apple Developer Program 后，在下面加上 com.apple.developer.journal.allow: true，
    # 并在 SWIFT_ACTIVE_COMPILATION_CONDITIONS 里加上 JOURNALING_SUGGESTIONS。
    entitlements:
      path: PhotoDiary/PhotoDiary.entitlements
      properties:
        com.apple.security.application-groups: [group.com.kejincai.photodiary]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kejincai.photodiary
        PRODUCT_NAME: PhotoDiary
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1,2,6"
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        # Mac 版要沙盒：照片图库、地名和地图要联网、分享图存文件。
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": PhotoDiary/PhotoDiary-Mac.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: PhotoDiary/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Photo Diary
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Photo Diary keeps your diary in each photo's caption. It needs to read and edit captions, and never copies or uploads your photos.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # 必须是 zh-Hans：源语言（简体中文）的文字编译后不单独成表，找不到时系统回退到这个语言的表；
        # 写成 en 的话，中文界面里 SwiftUI 的文字会变成英文。代价是系统语言不在支持之列时，系统显示的文字回退到中文。
        DEVELOPMENT_LANGUAGE: zh-Hans
        CODE_SIGN_STYLE: Automatic
  PhotoDiaryWatch:
    type: application
    platform: watchOS
    sources:
      - path: PhotoDiaryWatch
      - path: Shared
      - path: PhotoDiary/Resources/Localizable.xcstrings
      - path: PhotoDiary/Resources/InfoPlist.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kejincai.photodiary.watchkitapp
        PRODUCT_NAME: PhotoDiaryWatch
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Photo Diary
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.kejincai.photodiary
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_LANGUAGE: zh-Hans  # 见 PhotoDiary 目标
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  # 主屏、锁屏小组件和控制中心按钮。数据来自 App 写在 App Group 里的快照，不读照片库。
  PhotoDiaryWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PhotoDiaryWidgets
      - path: Shared
      - path: WidgetShared
      - path: PhotoDiary/Resources/Localizable.xcstrings
      - path: PhotoDiary/Resources/InfoPlist.xcstrings
    entitlements:
      path: PhotoDiaryWidgets/PhotoDiaryWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.kejincai.photodiary]
    info:
      path: PhotoDiaryWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kejincai.photodiary.widgets
        PRODUCT_NAME: PhotoDiaryWidgets
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Photo Diary
        DEVELOPMENT_LANGUAGE: zh-Hans  # 见 PhotoDiary 目标
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  PhotoDiaryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PhotoDiaryTests
    dependencies:
      - target: PhotoDiary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kejincai.photodiary.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PhotoDiary.app/PhotoDiary"
        BUNDLE_LOADER: "$(TEST_HOST)"
  # 界面测试：像用户一样点完每一条流程（写、追加、编辑、删除、标签、搜索、设置）。照片用 Tools/TestPhotos/seed.sh。
  PhotoDiaryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PhotoDiaryUITests
    dependencies:
      - target: PhotoDiary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kejincai.photodiary.uitests
        GENERATE_INFOPLIST_FILE: YES
        # XCTestCase 的 setUp / init 不在主线程隔离里；测试方法自己标 @MainActor（Xcode 模板的写法）。
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        TEST_TARGET_NAME: PhotoDiary
schemes:
  PhotoDiaryWatch:
    build:
      targets:
        PhotoDiaryWatch: all
  PhotoDiary:
    build:
      targets:
        PhotoDiary: all
        PhotoDiaryTests: [test]
        PhotoDiaryUITests: [test]
    test:
      targets:
        - PhotoDiaryTests
        - PhotoDiaryUITests
