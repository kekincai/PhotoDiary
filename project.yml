name: PhotoDiary
options:
  bundleIdPrefix: com.kejincai
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEVELOPMENT_TEAM: ""
targets:
  PhotoDiary:
    type: application
    platform: iOS
    sources:
      - path: PhotoDiary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kejincai.photodiary
        PRODUCT_NAME: PhotoDiary
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: PhotoDiary/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: 照片日记
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 日记写在照片的“说明”里。照片日记需要读取和修改照片说明，不会复制或上传你的照片。
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDevelopmentRegion: zh-Hans
        INFOPLIST_KEY_PHPhotoLibraryPreventAutomaticLimitedAccessAlert: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_LANGUAGE: zh-Hans
        CODE_SIGN_STYLE: Automatic
  PhotoDiaryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PhotoDiaryTests
    dependencies:
      - target: PhotoDiary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kejincai.photodiary.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PhotoDiary.app/PhotoDiary"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  PhotoDiary:
    build:
      targets:
        PhotoDiary: all
        PhotoDiaryTests: [test]
    test:
      targets:
        - PhotoDiaryTests
